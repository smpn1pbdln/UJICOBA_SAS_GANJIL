                        }
                    }
                    window.lastPullAt = Date.now();
                } catch(e) { console.error('pullCloud gagal', e); }

            const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;

        // Enter / Esc untuk jendela dialog (konfirmasi, password, token, detail soal)
        window.handleModalKeys = function(e) {
            const isVisible = el => el && !el.classList.contains('hidden') && el.innerHTML.trim() !== '';
            const cm = document.getElementById('confirm-modal'), am = document.getElementById('app-modal');
            const modal = isVisible(cm) ? cm : (isVisible(am) ? am : null);
            if (!modal) return false;
            const active = document.activeElement;
            const rows = modal.querySelectorAll('div.flex.gap-2 button');
            if (e.key === 'Escape') {
                const cancel = modal.querySelector('#confirm-btn-cancel') || rows[0];
                if (cancel) { e.preventDefault(); cancel.click(); return true; }
                return false;
            }
            if (e.key === 'Enter') {
                if (active && ['BUTTON', 'A', 'TEXTAREA'].includes(active.tagName)) return false;
                if (active && modal.contains(active) && active.closest('form')) return false; // ditangani navigasi form
                if (modal.querySelector('form')) return false;
                const primary = modal.querySelector('#confirm-btn-ok') || rows[rows.length - 1];
                if (primary) { e.preventDefault(); primary.click(); return true; }
            }
            return false;
        };

        document.addEventListener('keydown', function(e) {
            if ((e.key === 'Enter' || e.key === 'Escape') && window.handleModalKeys(e)) return;
            // 1. Navigasi saat ujian berlangsung untuk berpindah soal
            if (window.isExamActive && window.currentRoute === 'siswa-exam') {
                if (e.key === 'Enter' && !['INPUT','BUTTON','TEXTAREA','SELECT','A'].includes((document.activeElement||{}).tagName)) { e.preventDefault(); window.nextQuestion(); return; }
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault(); window.nextQuestion();
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault(); window.prevQuestion();
                }
            } else {
                // 2. Navigasi cerdas untuk form input, login, dan modal
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter') {
                    const activeEl = document.activeElement;
                    
                    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT' || activeEl.tagName === 'TEXTAREA')) {
                        const form = activeEl.closest('form');
                        
                        if (form) {
                            // Ambil seluruh elemen input yang bisa difokuskan di dalam form tersebut
                            const inputs = Array.from(form.querySelectorAll('input:not([type="hidden"]), select, textarea, button[type="submit"]'));
                            const index = inputs.indexOf(activeEl);
                            
                            if (index > -1) {
                                if (e.key === 'ArrowDown' && activeEl.tagName !== 'TEXTAREA') {
                                    e.preventDefault();
                                    if (index < inputs.length - 1) inputs[index + 1].focus(); // Pindah ke bawah
                                } else if (e.key === 'ArrowUp' && activeEl.tagName !== 'TEXTAREA') {
                                    e.preventDefault();
                                    if (index > 0) inputs[index - 1].focus(); // Pindah ke atas
                                } else if (e.key === 'Enter' && activeEl.tagName !== 'TEXTAREA') {
                                    e.preventDefault();
                                    // Jika ditekan Enter: Pindah ke kolom berikutnya JIKA bukan kolom password/terakhir
                                    if (!/password/i.test(activeEl.id || '') && activeEl.type !== 'password' && index < inputs.length - 2) {
                                        inputs[index + 1].focus();
                                    } else {
                                        // Submit form jika berada di kolom terakhir atau password
                                        const submitBtn = form.querySelector('button[type="submit"]');
                                        if (submitBtn) submitBtn.click();
                                    }
                                }
                            }
                        } else if (e.key === 'Enter') {
                            activeEl.blur(); // Lepas fokus jika menekan enter pada input di luar form (seperti kolom pencarian)
                        }
                    }
                }
            }
        });

            e.preventDefault(); 
            const username = document.getElementById('siswa-nomor').value.trim();
            const password = document.getElementById('siswa-password').value.trim();
            await window.pullCloud(['peserta','jadwal','soal','hasil']);
            const foundPeserta = window.appData.peserta.find(p => p.username === username);
            if (!foundPeserta) { showNotification('Username tidak ditemukan di Database!'); return; }
            
            const dbPassword = foundPeserta.password;
            if (dbPassword) { if (password !== dbPassword) { showNotification('Password salah!'); return; } } 
            else { if (password !== "123456" && password !== username) { showNotification('Password salah!'); return; } }

            if (String(foundPeserta.status_blokir || 'AKTIF').toUpperCase() === 'BLOKIR') { showNotification('AKUN ANDA DIBLOKIR!'); return; }

            const hasResume = !!localStorage.getItem('cbt_exam_state_' + username);
            if (foundPeserta.status_login === 'AKTIF' && !hasResume) {
                showNotification('Akun sedang AKTIF di perangkat lain! Lapor Pengawas untuk mereset akun Anda.');
                return;
            }
            
            const sid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            const claimed = await window.claimLogin(username, sid);
            if (!claimed) { showNotification('Akun sedang AKTIF di perangkat lain! Lapor Pengawas untuk mereset akun Anda.'); return; }

            window.currentUser = { nomor: username, nama: foundPeserta.nama, tingkat: foundPeserta.tingkat, kelas: foundPeserta.kelas, role: 'siswa' };
            sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser));
            window.violationCount = 0; 
            if (!window.tryResumeExam()) window.loadSiswaSelectMapelView();
        }

        window.tryResumeExam = function() {
            try {
                const st = JSON.parse(localStorage.getItem(window.examStateKey()) || 'null');
                if (!st || !st.mapel || !st.endTime) return false;
                const soalList = window.appData.soal.filter(x => String(x.tingkat) === String(window.currentUser.tingkat) && x.mapel === st.mapel);
                if (!soalList.length) { window.clearExamState(); return false; }
                window.currentUser.mapel = st.mapel; window.examQuestions = window.seededShuffle(soalList);
                window.studentAnswers = st.answers || {}; window.studentRagu = st.ragu || {}; window.currentQuestionIndex = Math.min(st.idx || 0, soalList.length - 1);
                window.violationCount = st.violations || 0; window.examEndTime = st.endTime; window.isExamActive = true;
                document.getElementById('login-view').classList.add('hidden'); document.getElementById('main-app').classList.remove('hidden');
                if (Date.now() >= st.endTime) { window.submitFinalAnswers(); return true; }
                renderCBTExamInterface(); startExamTimer(); window.requestWakeLock();
                window.showNotification('Ujian dilanjutkan. Waktu tetap berjalan selama Anda keluar.');
                return true;
            } catch(e) { return false; }
        };

            e.preventDefault(); 
            const n = document.getElementById('pengawas-nama').value.trim();
            const pw = document.getElementById('pengawas-password').value.trim();
            const pg = (window.appData.pengawas || []).find(x => String(x.nama).trim().toLowerCase() === n.toLowerCase());
            if (pg && pg.aktif === false) { showNotification('Akun pengawas nonaktif. Hubungi admin.'); return; }
            const okPw = pg ? String(pg.password || '123') : '123';
            if (pw !== okPw) { showNotification('Password Pengawas Salah!'); return; }

            window.currentUser = { nama: n, ruang: document.getElementById('pengawas-ruang').value, role: 'pengawas' }; 
            sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser)); initAppSession(); 
        }
        
        window.handleAdminLogin = function(e) { 
            e.preventDefault(); 
            if (document.getElementById('admin-username').value.trim() === "admin" && document.getElementById('admin-password').value === "123tek") { 
                window.currentUser = { nama: "Administrator", role: "admin" }; sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser)); initAppSession(); 
            } else { showNotification('Username/Password salah!'); }

        window.handleLogout = function(isPopState = false) {
            if (window.currentUser && window.currentUser.role === 'siswa') {
                if (!window.isExamActive) window.saveSiswaStatus(window.currentUser.nomor, { status_login: 'OFFLINE' });

            if(window.dashboardInterval) clearInterval(window.dashboardInterval);

        window.hapusFolderMapel = function(idx) {
            const m = (window._folderMapelList || [])[idx]; const t = String(window.currentFilterTingkat);

            const n = window.appData.soal.filter(x => String(x.tingkat) === t && x.mapel === m).length;
            window.showPasswordConfirm(`Hapus folder "${m}" Kelas ${t} beserta ${n} soal di dalamnya? Tindakan ini tidak bisa dibatalkan.`, () => {
                window.appData.soal = window.appData.soal.filter(x => !(String(x.tingkat) === t && x.mapel === m));
                window.saveLocalData('soal'); window.loadManajemenSoal(t, true, 'semua');
                window.showNotification('Folder dihapus.');
            });
        };
        window.gabungFolderMapel = function(idx) {
            const m = (window._folderMapelList || [])[idx]; const t = String(window.currentFilterTingkat);
            if (m === undefined) return;

            const data = [{ jenis: "PG", tingkat: "7", mapel: "Bahasa Indonesia", pertanyaan: "Contoh soal", pilihan_a: "A", pilihan_b: "B", pilihan_c: "C", pilihan_d: "D", kunci: "A", skor: 2 }];
            const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Template"); XLSX.writeFile(wb, "Template_Soal.xlsx");
        };

        window.handleExcelImportSoal = async function(e) {
            const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result); const workbook = XLSX.read(data, {type: 'array'});
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    let count = 0, skipped = 0; const skippedFolders = new Set();
                    for(let r of rows) { 
                        const rowData = {}; 
                        for (let key in r) rowData[key.toLowerCase().trim()] = r[key]; 
                        
                        const pertanyaan = String(rowData.pertanyaan||'').trim();
                        if (!pertanyaan) continue;
                        
                        const newSoal = { 
                            id: window.generateId(), 
                            jenis: String(rowData.jenis||'PG').toUpperCase(), 
                            tingkat: String(rowData.tingkat||'7').trim(), 
                            mapel: window.normalisasiMapel(rowData.mapel||'Umum'), 
                            pertanyaan: pertanyaan, 
                            pilihan_a: String(rowData.pilihan_a||''), 
                            pilihan_b: String(rowData.pilihan_b||''), 
                            pilihan_c: String(rowData.pilihan_c||''), 
                            pilihan_d: String(rowData.pilihan_d||''), 
                            kunci: String(rowData.kunci||'A').toUpperCase(), 
                            skor: parseInt(rowData.skor||2) 
                        };
                        if (window.hitungSkorFolder(newSoal.tingkat, newSoal.mapel) + window.skorSoal(newSoal) > window.MAKS_SKOR_PER_MAPEL) { skipped++; skippedFolders.add(`${newSoal.mapel} (Kls ${newSoal.tingkat})`); continue; }
                        window.appData.soal.push(newSoal); 
                        count++;
                    }
                    if (skipped > 0) window.showNotification(`${skipped} soal dilewati karena total skor folder akan melebihi maksimal ${window.MAKS_SKOR_PER_MAPEL}: ${[...skippedFolders].join(', ')}`);
                    if (count > 0) {
                        await window.saveLocalData('soal');
                        if (skipped === 0) window.showNotification(`Berhasil import ${count} soal baru!`); 
                        window.loadManajemenSoal(window.currentFilterTingkat || 'semua', true, window.currentFilterMapel || 'semua');
                    } else if (skipped === 0) { 
                        window.showNotification('Gagal: Format kolom tidak sesuai atau data kosong!'); 
                    }
                } catch(err) { 
                    window.showNotification('Gagal membaca file Excel!'); 
                    console.error(err); 
                }
                
                document.getElementById('excel-soal-input').value = ''; 
            }; 
            reader.readAsArrayBuffer(file);
        };

        window.JAM_KE = ['1','2'];
        window.fmtTanggal = function(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '')); return m ? m[3] + '-' + m[2] + '-' + m[1].slice(2) : (iso || '-'); };
        window.HARI_UJIAN = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

            let data = window.appData.jadwal; let html = '';

            else {

                    const isAktif = String(j.status||'').toLowerCase() === 'aktif';
                    html += `<tr><td class="p-3 font-bold text-indigo-300">Kelas ${j.tingkat}</td><td class="p-3 font-semibold text-white tracking-tight">${j.mapel}</td><td class="p-3 text-slate-300">${j.hari ? j.hari + ', ' : ''}${window.fmtTanggal(j.tanggal)}</td><td class="p-3 text-center font-bold text-sky-300">${j.jam_ke ? j.jam_ke : '-'}</td><td class="p-3 text-center"><span class="px-2 py-0.5 rounded font-mono font-bold text-amber-300 bg-amber-500/10 tracking-widest">${j.token||'-'}</span></td><td class="p-3 text-center text-slate-300">${j.durasi||90} m</td><td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-[9px] font-extrabold uppercase tracking-widest ${isAktif?'bg-emerald-500/20 text-emerald-400':'bg-red-500/20 text-red-400'}">${j.status||'Aktif'}</span></td><td class="p-3 text-center space-x-1"><button onclick="window.toggleStatusJadwal('${j.id}', '${j.status}')" class="px-2 py-1 rounded text-[9px] uppercase font-bold tracking-widest ${isAktif?'bg-red-500/20 text-red-400':'bg-emerald-500/20 text-emerald-400'}">${isAktif?'Nonaktif':'Aktifkan'}</button><button onclick="window.openNewJadwalModal('${j.id}')" class="px-2 py-1 bg-indigo-500/20 text-indigo-300 rounded text-[9px] uppercase font-bold tracking-widest" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button><button onclick="window.hapusJadwal('${j.id}')" class="px-2 py-1 bg-red-500/10 text-red-400 rounded text-[9px] uppercase font-bold tracking-widest"><i class="fa-solid fa-trash"></i></button></td></tr>`;

            window.currentRoute = 'peserta'; 
            window.currentFilterTingkat = filterTingkat;

            const area = document.getElementById('content-container'); if(!area) return;

            let baseFiltered = window.appData.peserta.filter(p => String(p.tingkat) === filterTingkat);

            `;

            let html = '';
            if(paginatedData.length === 0) { 
                html = `<div class="glass-card-dark p-6 rounded-2xl text-center text-slate-500 font-medium text-[11px]">${filterKelas ? 'Siswa tidak ditemukan.' : 'Belum ada siswa di tingkat ini.'}</div>`; 
            } else {

                    <div class="glass-card-dark rounded-2xl overflow-hidden border border-slate-800"><div class="overflow-x-auto"><table class="w-full text-left text-[11px]"><thead><tr class="bg-slate-900 text-slate-400 font-bold uppercase tracking-wider"><th class="p-3 w-10"></th><th class="p-3">Username</th><th class="p-3">Nama</th><th class="p-3 text-center">Kelas & Ruang</th><th class="p-3 text-center">Password</th><th class="p-3 text-center">Aksi</th></tr></thead><tbody class="divide-y divide-slate-800">`;

        /* Ekspor / backup Data Siswa (termasuk password-token login). Kolom sama dengan template Import, jadi file ini bisa diimpor lagi. */
        window.exportPesertaExcel = function() {
            const list = (window.appData.peserta || []).slice();
            if (!list.length) return window.showNotification('Belum ada data siswa untuk diekspor.');
            list.sort((a, b) => String(a.tingkat || '').localeCompare(String(b.tingkat || ''), 'id', { numeric: true }) || String(a.kelas || '').localeCompare(String(b.kelas || ''), 'id', { numeric: true }) || String(a.nama || '').localeCompare(String(b.nama || ''), 'id'));
            const aoa = [['username', 'nama', 'tingkat', 'kelas', 'ruang', 'password', 'status']];
            // password kosong berarti siswa masuk dengan password bawaan (123456), jadi ditulis eksplisit agar backup lengkap
            list.forEach(p => aoa.push([String(p.username || ''), p.nama || '', String(p.tingkat || ''), p.kelas || '', p.ruang || '', String(p.password || '123456'), String(p.status_blokir || 'AKTIF').toUpperCase() === 'BLOKIR' ? 'Blokir' : 'Aktif']));
            const ws = XLSX.utils.aoa_to_sheet(aoa);
            ws['!cols'] = [{ wch: 16 }, { wch: 34 }, { wch: 9 }, { wch: 9 }, { wch: 14 }, { wch: 14 }, { wch: 9 }];
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data Siswa');
            const jd = (window.appData.jadwal || []).filter(j => j && j.token);
            if (jd.length) {
                const a2 = [['Tingkat', 'Mata Pelajaran', 'Hari', 'Tanggal', 'Token Ujian']];
                jd.forEach(j => a2.push([String(j.tingkat || ''), j.mapel || '', j.hari || '', j.tanggal || '', String(j.token)]));
                const ws2 = XLSX.utils.aoa_to_sheet(a2); ws2['!cols'] = [{ wch: 9 }, { wch: 30 }, { wch: 11 }, { wch: 14 }, { wch: 14 }];
                XLSX.utils.book_append_sheet(wb, ws2, 'Token Ujian');
            }
            const d = new Date(), pad = n => String(n).padStart(2, '0');
            XLSX.writeFile(wb, 'Backup_Data_Siswa_' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.xlsx');
            window.showNotification('Berhasil mengekspor ' + list.length + ' data siswa.');
        };

        window.handleExcelImportPeserta = function(e) {
            const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result); const workbook = XLSX.read(data, {type: 'array'});
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    let count = 0;
                    for(let r of rows) {
                        const rowData = {}; for (let key in r) rowData[key.toLowerCase().trim()] = r[key];
                        const username = String(rowData.username||'').trim();
                        const nama = String(rowData.nama||'').trim();
                        if (!username || !nama) continue;
                        const existingIdx = window.appData.peserta.findIndex(p => p.username === username);
                        const newData = {
                            username, nama,
                            tingkat: String(rowData.tingkat||'7').trim(),
                            kelas: String(rowData.kelas||'7A').toUpperCase().trim(),
                            ruang: String(rowData.ruang||'Ruang 001').trim(),
                            password: rowData.password ? String(rowData.password) : window.generateRandomPassword(),
                            status_blokir: 'AKTIF'
                        };
                        if (existingIdx > -1) { window.appData.peserta[existingIdx] = { ...window.appData.peserta[existingIdx], ...newData }; }
                        else { window.appData.peserta.push({ id: window.generateId(), ...newData }); }
                        count++;
                    }
                    if (count > 0) {
                        await window.saveLocalData('peserta');
                        window.showNotification(`Berhasil import ${count} data siswa!`);
                        window.loadDatabasePeserta(window.currentFilterTingkat);
                    } else { window.showNotification('Format file Excel tidak sesuai!'); }
                } catch(err) { window.showNotification('Gagal membaca file Excel!'); }
                document.getElementById('excel-peserta-input').value = '';
            }; reader.readAsArrayBuffer(file);
        };

        /* ===== v9: Ekspor Data Pengawas (25/halaman) & Rekap Mengawas ===== */
        window.pgEsc = function(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
        /* Hari, Tanggal untuk daftar hadir: hari ikut tanggal yang dipilih di kalender */
        window.dhHariTanggal = function(d) {
            const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'], bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            return `${hari[d.getDay()]}, ${d.getDate()} ${bln[d.getMonth()]} ${d.getFullYear()}`;
        };
        window.dhDefaultTanggal = function() { return window.dhHariTanggal(new Date()); };
        window.isoHariIni = function() { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
        window.dhPilihTanggal = function(iso) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); if (!m) return;
            window.dhTglIso = iso;
            window.dhTanggal = window.dhHariTanggal(new Date(+m[1], +m[2] - 1, +m[3]));
            const el = document.getElementById('dh-tanggal'); if (el) el.value = window.dhTanggal;
        };
        window.pgTglHariIni = function() { const b = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; const d = new Date(); return `${d.getDate()} ${b[d.getMonth()]} ${d.getFullYear()}`; };
        window.pgTabsHtml = function(tab) {
            const on = 'bg-indigo-600 text-white shadow-lg', off = 'bg-slate-900 text-slate-400 hover:text-white';
            return `<div class="flex gap-2 mb-5 bg-slate-900/50 p-1 rounded-xl w-fit border border-slate-800 font-bold uppercase"><button onclick="window.loadDataPengawas()" class="px-4 py-2 rounded-lg tracking-wider text-[10px] transition ${tab === 'data' ? on : off}">Data Pengawas</button><button onclick="window.loadRekapMengawas()" class="px-4 py-2 rounded-lg tracking-wider text-[10px] transition ${tab === 'rekap' ? on : off}">Rekap Mengawas</button></div>`;
        };
        window.parseTglIndo = function(s) {
            const bln = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
            const m = String(s || '').trim().toLowerCase().match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
            if (m) { const mi = bln.indexOf(m[2]); if (mi >= 0) return new Date(+m[3], mi, +m[1]).getTime(); }
            const t = Date.parse(s); return isNaN(t) ? 0 : t;
        };
        /* Rekap diambil dari Berita Acara: 1 Berita Acara = 1 sesi mengawas (1 mapel di 1 ruang pada 1 tanggal) */
        window.buildRekapMengawas = function() {
            const norm = s => String(s || '').trim().toLowerCase();
            const map = new Map();
            (window.appData.pengawas || []).forEach(p => map.set(norm(p.nama), { nama: p.nama, nip: p.nip || '-', aktif: p.aktif !== false, hari: {} }));
            const tglMap = new Map();
            (window.appData.beritaAcara || []).forEach(b => {
                const k = norm(b.pengawas); if (!k) return;
                if (!map.has(k)) map.set(k, { nama: b.pengawas, nip: '-', aktif: true, hari: {} });
                const tgl = String(b.tanggal || '-').trim(); const r = map.get(k);
                (r.hari[tgl] = r.hari[tgl] || []).push({ mapel: b.mapel || '-', ruang: b.ruang || '-' });
                tglMap.set(tgl, window.parseTglIndo(tgl));
            });
            const tanggal = [...tglMap.entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]);
            const rows = [...map.values()].map(r => ({ ...r, total: Object.values(r.hari).reduce((n, a) => n + a.length, 0) }))
                .filter(r => r.aktif || r.total > 0).sort((a, b) => String(a.nama).localeCompare(String(b.nama)));
            return { tanggal, rows };
        };
        /* Cetak tabel dengan batas baris per halaman (header tabel diulang di tiap halaman) */
        window.cetakTabelPerHalaman = function(title, subtitle, thead, rowsHtml, perHalaman, tglStr, extraCss) {

            window.cetakDaftarHadirTemplate(title, subtitle, thead, tbody, tglStr, extraCss);
        };
        window.PG_CSS = 'table{margin-bottom:12px !important;font-size:11px !important} th,td{padding:4px 6px !important} .signature-area{margin-top:10px !important} .kop img{width:80px !important;height:80px !important}';

        window.exportPengawasExcel = function() {

        window.loadRekapMengawas = function() {

        window.exportRekapMengawasExcel = function() {

        window.downloadExcelTemplatePengawas = function() {

        window.handleExcelImportPengawas = function(e) {
            const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    /* v7: header fleksibel (Nama/NAMA/Nama Pengawas), semua sheet dibaca, NIP jadi identitas utama, ada laporan hasil */
                    const wb = XLSX.read(new Uint8Array(evt.target.result), {type: 'array'});
                    const norm = k => String(k).toLowerCase().replace(/[^a-z0-9]/g, '');
                    const pick = (r, re) => { for (const k in r) { if (re.test(norm(k))) return String(r[k] == null ? '' : r[k]).trim(); } return ''; };
                    const lama = window.appData.pengawas.slice(); const urut = []; const dipakai = new Set();
                    let totalBaris = 0, dilewati = 0, baru = 0, diperbarui = 0; const contohLewat = [], daftarLewat = [], daftarGabung = []; let nipAngka = 0;
                    wb.SheetNames.forEach(sn => {
                        XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: '' }).forEach((r, i) => {
                            totalBaris++;
                            const nama = pick(r, /^nama/); const nip = pick(r, /^(nip|nuptk|nomorinduk)/);
                            if (!nama) { dilewati++; if (contohLewat.length < 3) contohLewat.push(sn + ' baris ' + (i + 2)); daftarLewat.push(sn + ' baris ' + (i + 2) + ': kolom nama kosong' + (nip ? ' (NIP ' + nip + ')' : '')); return; }
                            for (const k in r) { if (/^(nip|nuptk|nomorinduk)/.test(norm(k)) && typeof r[k] === 'number' && String(r[k]).replace(/\D/g, '').length >= 15) nipAngka++; }
                            const ruang = pick(r, /^ruang/) || 'Ruang 001'; const password = pick(r, /^(pass|kata)/) || '123';
                            const newData = { nama, nip, ruang, password };
                            /* identitas: NIP bila ada; bila tidak, nama. Nama sama dengan NIP berbeda = orang berbeda */
                            const cocok = p => nip ? (p.nip === nip || (!p.nip && String(p.nama).toLowerCase() === nama.toLowerCase())) : (String(p.nama).toLowerCase() === nama.toLowerCase() && !p.nip) || (String(p.nama).toLowerCase() === nama.toLowerCase());
                            const dupIdx = urut.findIndex(cocok);
                            if (dupIdx > -1) { daftarGabung.push(sn + ' baris ' + (i + 2) + ': ' + nama + (nip ? ' (NIP ' + nip + ')' : ' (tanpa NIP)') + ' dianggap sama dengan "' + urut[dupIdx].nama + '"' + (urut[dupIdx].nip ? ' (NIP ' + urut[dupIdx].nip + ')' : '')); urut[dupIdx] = { ...urut[dupIdx], ...newData }; return; }
                            const ex = lama.find(p => !dipakai.has(p.id) && cocok(p));
                            if (ex) { dipakai.add(ex.id); urut.push({ ...ex, ...newData }); diperbarui++; } else { urut.push({ id: window.generateId(), ...newData }); baru++; }
                        });
                    });
                    if (urut.length) window.appData.pengawas = [...urut, ...lama.filter(p => !dipakai.has(p.id))];
                    window.saveLocalData('pengawas'); window.loadDataPengawas();
                    let msg = `Import selesai: ${baru} baru, ${diperbarui} diperbarui dari ${totalBaris} baris.`;
                    if (dilewati) msg += ` ${dilewati} baris dilewati karena kolom nama kosong/tidak terbaca (${contohLewat.join(', ')}).`;
                    if (!urut.length) msg = 'Tidak ada data terbaca. Pastikan ada kolom "nama" di baris pertama.';
                    if (daftarGabung.length) msg += ` ${daftarGabung.length} baris digabung karena dianggap data ganda.`;
                    window.showNotification(msg);
                    if (dilewati || daftarGabung.length || nipAngka) {
                        const li = a => a.slice(0, 60).map(x => `<li>${window.pgEsc(x)}</li>`).join('') + (a.length > 60 ? `<li>...dan ${a.length - 60} lainnya</li>` : '');
                        let m = document.getElementById('app-modal'); if (!m) { m = document.createElement('div'); m.id = 'app-modal'; document.body.appendChild(m); }
                        m.className = 'fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/80 p-4 backdrop-blur-md';
                        m.innerHTML = `<div class="glass-card-dark p-6 rounded-3xl max-w-2xl w-full border border-slate-700 shadow-2xl max-h-[85vh] overflow-y-auto"><h3 class="text-lg font-bold text-white mb-1 font-heading tracking-tight">Laporan Import Pengawas</h3><p class="text-[11px] text-slate-400 mb-4">${totalBaris} baris dibaca: ${baru} baru, ${diperbarui} diperbarui, ${daftarGabung.length} digabung, ${dilewati} dilewati.</p>`

        window.initSignatureCanvas = function() {
            const canvas = document.getElementById('signature-canvas'); if(!canvas) return;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let isDrawing = false; let lastX = 0; let lastY = 0; window.isCanvasSigned = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            }

            function start(e) { e.preventDefault(); isDrawing = true; window.isCanvasSigned = true; const pos = getPos(e); lastX = pos.x; lastY = pos.y; }
            function draw(e) {
                if(!isDrawing) return; e.preventDefault(); const pos = getPos(e);
                ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
                lastX = pos.x; lastY = pos.y;
            }
            function end(e) { if(!isDrawing) return; e.preventDefault(); isDrawing = false; }

            canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', end); canvas.addEventListener('mouseout', end);
            canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', end);
        };

        window.clearSignature = function() {
            const canvas = document.getElementById('signature-canvas');
            if(canvas) { 
                const ctx = canvas.getContext('2d'); 
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height); 
                window.isCanvasSigned = false; 
            }
        };

        window.previewImage = function(input, imgId, hiddenId) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 250;
                    let scaleSize = 1;
                    if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
                    canvas.width = img.width * scaleSize;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/png');
                    document.getElementById(imgId).src = dataUrl;
                    document.getElementById(hiddenId).value = dataUrl;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        };

                <div class="mb-6"><h1 class="text-2xl font-black text-white font-heading tracking-tight">Tips & Panduan</h1><p class="text-[11px] text-slate-400 mt-1 tracking-wide">Panduan teknis operasional aplikasi CBT Panesa</p></div>
                
                <div class="glass-card-dark p-6 rounded-3xl border border-slate-800 space-y-4 mb-6">
                    <h2 class="text-base font-bold text-sky-400 font-heading tracking-tight"><i class="fa-solid fa-server mr-2"></i>3 Strategi Wajib Server Gratis (Kapasitas 1055 Siswa)</h2>
                    <div class="text-[11px] text-slate-300 space-y-3 leading-relaxed">
                        <p>Agar ujian massal berjalan lancar menggunakan Supabase versi gratis, Panitia wajib menerapkan trik berikut:</p>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">1. Login & Tarik Soal Secara Bertahap (JANGAN SERENTAK)</h3><p>Jangan biarkan 1055 anak menekan tombol ujian di detik yang sama. Instruksikan login per blok ruang (Misal: Ruang 1-10 dulu, tunggu 1-2 menit, baru Ruang 11-20). Saat siswa sudah masuk ke tampilan soal, mereka tidak lagi membebani server.</p></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">2. Patuhi Panduan Gambar (Gunakan Hosting Luar)</h3><p>Pastikan SEMUA gambar soal/jawaban di-hosting di tempat gratis seperti postimages.org (lihat panduan di bawah). Ini menjaga agar kuota Bandwidth (lalu lintas data) 5GB bulanan Supabase Anda tidak cepat habis.</p></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">3. "Panaskan" Server pada H-1 Ujian</h3><p>Supabase gratis otomatis "tidur" jika project tidak diakses 7 hari. Buka dasbor Supabase H-1 ujian. Jika statusnya <i>Paused</i>, cukup klik <i>Restore</i>.</p></div>

                <div class="glass-card-dark p-6 rounded-3xl border border-slate-800 space-y-4">

                    <div class="text-[11px] text-slate-300 space-y-3 leading-relaxed">
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 1: Dapatkan Tautan (URL) Gambar</h3><p>Unggah gambar Anda ke <i>postimages.org</i>, <i>imgbb.com</i>, atau Blogger. Salin <b>Direct Link</b> (berakhiran .jpg/.png).</p></div>

                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-2">Langkah 2: Sisipkan di Kolom Soal</h3><p class="mb-2">Tempelkan kode ini di akhir kalimat pada Form Pertanyaan:</p><code class="block text-[9.5px] font-mono bg-slate-950 p-2.5 rounded-xl text-emerald-400 border border-emerald-500/20 break-all">&lt;br&gt;&lt;img src="TAUTAN_GAMBAR.jpg" style="max-width:100%; border-radius:8px; margin-top:8px;"&gt;</code></div>

                        </div>
                    </div>
                
                <div class="glass-card-dark p-6 rounded-3xl border border-slate-800 space-y-4 mt-6">
                    <h2 class="text-base font-bold text-amber-400 font-heading tracking-tight"><i class="fa-solid fa-computer mr-2"></i>Panduan Instal XAMPP (Server Lokal Lab Komputer)</h2>
                    <div class="text-[11px] text-slate-300 space-y-3 leading-relaxed">
                        <div class="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl"><p><b class="text-amber-300">Catatan penting:</b> XAMPP hanya berfungsi sebagai <i>web server (Apache)</i> yang menyajikan file aplikasi ini ke komputer siswa lewat jaringan lokal. Data ujian tetap tersimpan di Supabase (atau di browser jika Supabase tidak diaktifkan), jadi MySQL pada XAMPP tidak dipakai. Jika sinkronisasi Supabase aktif, komputer siswa tetap membutuhkan koneksi internet.</p></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 1: Unduh XAMPP</h3><p>Buka <i>apachefriends.org</i>, lalu unduh XAMPP untuk <b>Windows</b> (pilih versi PHP 8.x terbaru). Ukuran file sekitar 150 MB.</p></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 2: Jalankan Installer</h3><p>Klik kanan file installer, pilih <b>Run as administrator</b>. Jika muncul peringatan antivirus atau UAC, pilih <i>Yes/Allow</i>. Pada pilihan komponen, centang minimal <b>Apache</b> (MySQL, PHP, dan phpMyAdmin boleh dibiarkan tercentang). Klik <i>Next</i> sampai selesai.</p></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 3: Pilih Folder Instalasi</h3><p>Gunakan folder bawaan <b>C:\\xampp</b>. Hindari <i>C:\\Program Files</i> karena izin akses Windows sering menghambat Apache.</p></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 4: Jalankan Apache</h3><p>Buka <b>XAMPP Control Panel</b>, lalu klik <b>Start</b> pada baris Apache sampai statusnya berwarna hijau. Agar Apache otomatis menyala bersama komputer, centang kotak <b>Svc</b> (Service) di sebelah Apache.</p><p class="mt-2">Jika gagal dan muncul <i>Port 80 in use</i>, tutup aplikasi yang memakai port 80 (Skype, IIS, atau VPN). Atau ubah port lewat <b>Config → httpd.conf</b>, ganti baris berikut, lalu start ulang:</p><code class="block text-[9.5px] font-mono bg-slate-950 p-2.5 rounded-xl text-emerald-400 break-all mt-1.5">Listen 8080</code></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 5: Salin File Aplikasi CBT</h3><p>Buat folder <b>C:\\xampp\\htdocs\\cbt</b>. Salin file aplikasi ke dalamnya, lalu ganti namanya menjadi <b>index.html</b>.</p></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 6: Uji di Komputer Server</h3><p>Buka browser (Chrome disarankan), lalu akses alamat berikut. Jika tampil halaman login CBT, instalasi berhasil.</p><code class="block text-[9.5px] font-mono bg-slate-950 p-2.5 rounded-xl text-emerald-400 break-all mt-1.5">http://localhost/cbt/</code></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 7: Akses dari Komputer Siswa</h3><p>Di komputer server, buka <i>Command Prompt</i>, ketik <b>ipconfig</b>, dan catat <b>IPv4 Address</b> (contoh 192.168.1.10). Di komputer siswa (satu jaringan/switch), buka:</p><code class="block text-[9.5px] font-mono bg-slate-950 p-2.5 rounded-xl text-emerald-400 break-all mt-1.5">http://192.168.1.10/cbt/</code><p class="mt-2">Jika tidak bisa dibuka, izinkan Apache di <b>Windows Defender Firewall</b> (centang <i>Private networks</i>), atau buat <i>Inbound Rule</i> untuk port 80. Pastikan IP server diset <b>statis</b> agar alamatnya tidak berubah.</p></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 8: Persiapan Hari Ujian</h3><ul class="list-disc ml-4 space-y-1"><li>Matikan mode <i>Sleep</i>/<i>Hibernate</i> pada komputer server.</li><li>Sambungkan server ke UPS atau sumber listrik stabil.</li><li>Jangan menutup atau mematikan Apache selama ujian berlangsung.</li><li>Uji dari 2–3 komputer siswa sehari sebelum ujian (H-1).</li><li>Simpan cadangan file aplikasi dan ekspor data soal ke Excel.</li></ul></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 9: Cara Siswa Mengerjakan di Komputer Lab (XAMPP)</h3><p>Pastikan XAMPP sudah terinstal di komputer server sesuai langkah di atas, lalu salin file aplikasi ke:</p><code class="block text-[9.5px] font-mono bg-slate-950 p-2.5 rounded-xl text-emerald-400 break-all mt-1.5">C:\\xampp\\htdocs\\cbt\\index.html</code><ol class="list-decimal ml-4 space-y-2 mt-3"><li>Komputer siswa membuka alamat <b>http://IP-server/cbt/</b> (contoh <code class="inline-block text-[9.5px] font-mono bg-slate-950 p-2.5 rounded-xl text-emerald-400 break-all">http://192.168.1.10/cbt/</code>).</li><li><b>Jaringan lab harus punya internet</b>, karena nilai dan soal tetap dikirim ke Supabase. Jika tidak ada internet, jalankan ujian terlebih dahulu, lalu sambungkan internet dan klik tombol <b>Kirim Ulang Hasil Lokal</b> pada menu Rekap Nilai.</li></ol></div>
                    </div>
                </div>
                </div>
            `;
        };

        window.simpanKonfigurasiSupabase = async function(e) {
            e.preventDefault();
            const useSupabase = document.getElementById('sup-active').checked;
            const supabaseUrl = document.getElementById('sup-url').value.trim();
            const supabaseKey = document.getElementById('sup-key').value.trim();

            if (!useSupabase) {
                window.globalSettings.useSupabase = false; localStorage.setItem('cbt_global_settings', JSON.stringify(window.globalSettings)); window.supabaseClient = null;
                window.showNotification("Menggunakan penyimpanan lokal saja."); return;
            }

            if (supabaseUrl && supabaseKey) {
                window.showNotification("Memeriksa struktur database Cloud...");
                const tempClient = supabase.createClient(supabaseUrl, supabaseKey);
                try {
                    const { data, error } = await tempClient.from('cbt_panesa_data').select('key').limit(1);
                    if (error) throw new Error(error.message);
                    window.globalSettings.useSupabase = true; window.globalSettings.supabaseUrl = supabaseUrl; window.globalSettings.supabaseKey = supabaseKey;
                    localStorage.setItem('cbt_global_settings', JSON.stringify(window.globalSettings)); window.supabaseClient = tempClient;

                    if (data && data.length === 0) {
                        window.showNotification("Mengunggah data lokal ke Server Cloud...");
                        const tables = ['soal', 'peserta', 'jadwal', 'hasil', 'pengawas', 'beritaAcara'];
                        for (let t of tables) { if (window.appData[t] && window.appData[t].length > 0) { await window.supabaseClient.from('cbt_panesa_data').upsert({ key: 'cbt_data_' + t, value: window.appData[t] }); } }
                        await window.supabaseClient.from('cbt_panesa_data').upsert({ key: 'cbt_global_settings', value: window.globalSettings });
                    } else {
                        window.showNotification("Mengunduh data terbaru dari Server Cloud...");
                        const { data: cloudData } = await window.supabaseClient.from('cbt_panesa_data').select('*');
                        if (cloudData) { 
                            cloudData.forEach(row => { 
                                if (row.key === 'cbt_global_settings') {
                                    window.globalSettings = { ...window.globalSettings, ...row.value };
                                    localStorage.setItem(row.key, JSON.stringify(row.value));
                                } else {
                                    const key = row.key.replace('cbt_data_', ''); window.appData[key] = row.value; 
                                    localStorage.setItem(row.key, JSON.stringify(row.value)); 
                                }
                            }); 
                        }
                    }
                    window.showNotification("Server Cloud Berhasil Dihubungkan!"); setTimeout(() => window.location.reload(), 1500);
                } catch(err) { window.showNotification("Error: Pastikan tabel cbt_panesa_data sudah dibuat di SQL Supabase!"); }
            }
        };

        window.loadSiswaSelectMapelView = function(isPopState = false) {
            window.currentRoute = 'siswa-mapel'; window.isExamActive = false; const container = document.getElementById('content-container');
            if (!isPopState) history.pushState({ page: 'siswa-mapel' }, '', '#siswa-mapel');
            document.getElementById('login-view').classList.add('hidden'); document.getElementById('main-app').classList.remove('hidden'); document.getElementById('sidebar').classList.add('hidden'); document.getElementById('mobile-header').classList.add('hidden');
            
            const jadwalAktif = window.appData.jadwal.filter(j => String(j.tingkat) === String(window.currentUser.tingkat) && String(j.status).toLowerCase() === 'aktif');

            let html = `<div class="max-w-xl mx-auto space-y-6 mt-12"><div class="glass-card-dark p-8 rounded-3xl border border-slate-800 text-center"><h2 class="text-2xl font-bold text-white mb-2 font-heading tracking-tight">Pilih Ujian</h2><p class="text-[11px] text-slate-400 mb-6">Halo, <b class="text-indigo-300 uppercase tracking-widest">${window.currentUser.nama}</b></p><div class="space-y-3 text-left">`;
            if(jadwalAktif.length === 0) { html += `<div class="p-4 bg-slate-900 rounded-2xl text-center text-slate-400 text-[11px]">Belum ada jadwal aktif untuk kelas Anda saat ini.</div>`; } 
            else { 
                jadwalAktif.forEach(j => { 
                    const isFinished = window.appData.hasil.some(h => h.nama === window.currentUser.nama && h.kelas === window.currentUser.kelas && h.mapel === j.mapel);
                    
                    if (isFinished) {
                        html += `<div class="w-full flex justify-between items-center p-4 rounded-2xl bg-emerald-900/20 border border-emerald-800/40 cursor-not-allowed"><span class="font-bold text-slate-300 text-[11px] tracking-wide">${j.mapel}</span><span class="text-[10px] text-emerald-500 font-bold uppercase tracking-widest"><i class="fa-solid fa-check-circle mr-1"></i> Selesai</span></div>`;
                    } else {
                        html += `<button onclick="window.proceedToConfirmation('${j.mapel}')" class="w-full flex justify-between p-4 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-800 transition shadow"><span class="font-bold text-white text-[11px] tracking-wide">${j.mapel}</span><span class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">Mulai <i class="fa-solid fa-arrow-right ml-1"></i></span></button>`; 
                    }
                }); 
            }
            html += `</div><div class="mt-6"><button onclick="window.handleLogout()" class="px-5 py-2 bg-slate-800 text-slate-300 rounded-xl text-[10px] font-bold uppercase hover:bg-slate-700 tracking-wider transition shadow-md">Keluar Akun</button></div></div></div>`;
            container.innerHTML = html;
        };

        window.proceedToConfirmation = function(mapel) { window.currentUser.mapel = mapel; window.loadSiswaUjianView(); };
        window.loadSiswaUjianView = function(isPopState = false) {
            window.currentRoute = 'siswa-konfirmasi'; window.isExamActive = false; const container = document.getElementById('content-container');
            if (!isPopState) history.pushState({ page: 'siswa-konfirmasi' }, '', '#siswa-konfirmasi');
            container.innerHTML = `<div class="max-w-md mx-auto space-y-6 mt-12"><div class="glass-card-dark p-8 rounded-3xl border border-slate-800 text-center space-y-4"><h2 class="text-2xl font-bold text-white font-heading tracking-tight">Konfirmasi</h2><div class="bg-slate-900 p-4 rounded-2xl text-left text-[11px] space-y-2 text-slate-300 leading-relaxed"><p><b class="text-white uppercase tracking-wider">Nama:</b> ${window.currentUser.nama}</p><p><b class="text-white uppercase tracking-wider">Mapel:</b> ${window.currentUser.mapel}</p></div><div class="flex gap-2"><button onclick="window.loadSiswaSelectMapelView(true)" class="flex-1 py-1.5 bg-slate-800 text-white rounded-xl text-[10px] font-bold uppercase tracking-wider hover:bg-slate-700 transition">Kembali</button><button onclick="window.mulaiKerjakanUjian(this)" class="flex-1 py-1.5 gradient-btn text-white rounded-xl text-[10px] font-bold uppercase tracking-wider">Mulai</button></div></div></div>`;
        };

        window.mulaiKerjakanUjian = function(btn) {
            btn.disabled = true; 
            
            const isFinished = window.appData.hasil.some(h => h.mapel === window.currentUser.mapel && (h.username ? String(h.username) === String(window.currentUser.nomor) : (h.nama === window.currentUser.nama && h.kelas === window.currentUser.kelas)));
            if (isFinished) {
                window.showNotification("⚠️ Anda sudah menyelesaikan ujian ini!");
                window.loadSiswaSelectMapelView();
                return;
            }

            const soalList = window.appData.soal.filter(s => String(s.tingkat) === String(window.currentUser.tingkat) && s.mapel === window.currentUser.mapel);
            if (!soalList || soalList.length === 0) { window.showNotification("Soal belum tersedia!"); btn.disabled = false; return; }
            
            window.examQuestions = window.seededShuffle(soalList); window.currentQuestionIndex = 0; window.studentAnswers = {}; window.studentRagu = {}; window.isExamActive = true;
            const jd = window.appData.jadwal.find(j => String(j.tingkat) === String(window.currentUser.tingkat) && String(j.mapel) === String(window.currentUser.mapel) && String(j.status).toLowerCase() === 'aktif');
            const durMenit = (jd && parseInt(jd.durasi) > 0) ? parseInt(jd.durasi) : 90;
            window.examEndTime = Date.now() + durMenit * 60000; window.violationCount = 0; window.lastViolationAt = 0;
            try { const el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen().then(() => { window.fullscreenWasEntered = true; }).catch(() => {}); } catch(e) {}
            window.persistExamState(); renderCBTExamInterface(); startExamTimer(); window.requestWakeLock();
        };

        function renderCBTExamInterface() {
            window.persistExamState(); window.currentRoute = 'siswa-exam'; const container = document.getElementById('content-container');
            const q = window.examQuestions[window.currentQuestionIndex], qNum = window.currentQuestionIndex + 1, totalQ = window.examQuestions.length;
            const isPGK = q.jenis === 'PGK';
            const curAns = window.studentAnswers[q.id] || (isPGK ? [] : '');

            let navButtons = '';
            window.examQuestions.forEach((sq, idx) => {
                const ans = window.studentAnswers[sq.id];
                const hasAns = sq.jenis === 'PGK' ? (Array.isArray(ans) && ans.length > 0) : !!ans;
                let st = 'bg-slate-800 text-slate-300 border border-slate-700';
                if (idx === window.currentQuestionIndex) st = 'bg-indigo-600 text-white border-transparent';
                else if (hasAns) st = 'bg-emerald-600 text-white border-transparent shadow-lg';
                navButtons += `<button onclick="window.jumpToQuestion(${idx})" class="w-8 h-8 rounded-lg text-[10px] font-bold flex items-center justify-center transition-all ${st}">${idx+1}</button>`;
            });

            container.innerHTML = `
                <div class="space-y-4 max-w-4xl mx-auto mt-4">
                    <div class="glass-card-dark p-3 rounded-2xl border border-slate-800 flex justify-between items-center"><span class="text-[11px] font-bold text-white tracking-wide uppercase">${window.currentUser.mapel}</span><div class="flex items-center space-x-3"><span id="timer-display" class="font-mono text-amber-400 font-bold text-sm tracking-widest">--:--</span><button onclick="window.promptSubmitToken()" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[10px] font-bold uppercase tracking-widest transition shadow-md">Selesai</button></div></div>
                    <div class="glass-card-dark p-6 rounded-3xl border border-slate-800 space-y-4"><div class="flex justify-between items-center"><div class="text-[11px] font-extrabold text-indigo-400 tracking-widest uppercase">Soal ${qNum} dari ${totalQ}</div>${isPGK ? '<span class="px-2 py-0.5 bg-amber-500/20 text-amber-400 rounded text-[9px] font-bold uppercase tracking-widest">Pilih Beberapa Jawaban</span>' : ''}</div><div class="text-sm text-slate-100 font-medium leading-relaxed">${q.pertanyaan}</div><div class="space-y-2 mt-4">
                        ${['A','B','C','D'].map(k => {
                            const val = q[`pilihan_${k.toLowerCase()}`]; if(!val || val==='-') return ''; 
                            const sel = isPGK ? curAns.includes(k) : curAns === k;
                            return `<button onclick="window.selectAnswer('${q.id}', '${k}')" class="w-full text-left p-3 rounded-xl border flex items-center space-x-3 ${sel?'bg-indigo-600/30 border-indigo-500 text-white shadow-inner':'bg-slate-900 border-slate-800 text-slate-300'} hover:border-indigo-400 transition">
                                <div class="w-5 h-5 flex items-center justify-center ${isPGK ? 'rounded' : 'rounded-full'} border ${sel ? 'bg-indigo-500 border-indigo-400' : 'bg-slate-800 border-slate-600'} text-white flex-shrink-0">
                                    ${sel ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                                </div>
                                <span class="text-[11px] font-medium leading-relaxed">${k}. ${val}</span>
                            </button>`;
                        }).join('')}
                    </div></div>
                    <div class="flex justify-between"><button onclick="window.prevQuestion()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-[10px] font-bold uppercase tracking-widest shadow-md transition">Sebelum</button><button onclick="window.nextQuestion()" class="px-2.5 py-1 gradient-btn text-white rounded-lg text-[10px] font-bold uppercase tracking-widest shadow-md transition">Berikut</button></div>
                    <div class="glass-card-dark p-3 rounded-2xl border border-slate-800 flex gap-1.5 flex-wrap">${navButtons}</div>
                </div>
            `;
        }

        window.jumpToQuestion = function(idx) { window.currentQuestionIndex = idx; renderCBTExamInterface(); };
        window.prevQuestion = function() { if (window.currentQuestionIndex > 0) { window.currentQuestionIndex--; renderCBTExamInterface(); } };
        window.nextQuestion = function() { if (window.currentQuestionIndex < window.examQuestions.length - 1) { window.currentQuestionIndex++; renderCBTExamInterface(); } };
        window.selectAnswer = function(qId, key) { 
            const q = window.examQuestions.find(x => x.id === qId);
            if (q.jenis === 'PGK') {
                if (!window.studentAnswers[qId]) window.studentAnswers[qId] = [];
                let arr = window.studentAnswers[qId];
                if (arr.includes(key)) { arr = arr.filter(k => k !== key); } else { arr.push(key); }
                window.studentAnswers[qId] = arr;
            } else { window.studentAnswers[qId] = key; }
            renderCBTExamInterface(); 
        };

        function startExamTimer() {
            if (window.examTimerInterval) clearInterval(window.examTimerInterval);
            const tick = () => {
                window.examRemainingSeconds = Math.max(0, Math.round((window.examEndTime - Date.now()) / 1000));
                const m = String(Math.floor(window.examRemainingSeconds / 60)).padStart(2, '0'); const sc = String(window.examRemainingSeconds % 60).padStart(2, '0');
                const disp = document.getElementById('timer-display'); if(disp) disp.innerText = `${m}:${sc}`;
                if (window.examRemainingSeconds <= 0) { clearInterval(window.examTimerInterval); window.submitFinalAnswers(); }
            };
            tick(); window.examTimerInterval = setInterval(tick, 1000);
        }

        window.promptSubmitToken = function() {
            const jadwal = window.appData.jadwal.find(j => String(j.tingkat) === String(window.currentUser.tingkat) && String(j.mapel) === String(window.currentUser.mapel) && String(j.status).toLowerCase() === 'aktif');
            const activeToken = jadwal ? jadwal.token : '';

            if (!activeToken) { window.submitFinalAnswers(); return; }

            let modal = document.getElementById('app-modal'); if (!modal) { modal = document.createElement('div'); modal.id = 'app-modal'; document.body.appendChild(modal); }
            modal.className = 'fixed inset-0 z-[300] flex items-center justify-center bg-slate-900/80 p-4 backdrop-blur-md';
            modal.innerHTML = `
                <div class="glass-card-dark p-6 rounded-3xl max-w-sm w-full border border-slate-700 shadow-2xl text-center space-y-4">
                    <div class="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-xl shadow-inner"><i class="fa-solid fa-key"></i></div>
                    <div><h3 class="text-base font-bold text-white font-heading tracking-tight">Konfirmasi Selesai</h3><p class="text-[10px] text-slate-300 mt-1 leading-relaxed">Masukkan token ujian untuk mengumpulkan jawaban.</p></div>
                    <input type="text" id="input-token-selesai" class="w-full p-2.5 glass-input rounded-xl text-center font-mono font-bold text-amber-300 tracking-[0.2em] text-xs uppercase focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="TOKEN">
                    <div class="flex gap-2 pt-1"><button onclick="document.getElementById('app-modal').classList.add('hidden')" class="flex-1 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-[10px] font-bold uppercase tracking-wider hover:bg-slate-700 transition">Batal</button><button onclick="window.verifyAndSubmit('${activeToken}')" class="flex-1 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-[10px] font-bold uppercase tracking-wider shadow-lg transition">Kirim</button></div>
                </div>
            `;
            modal.classList.remove('hidden'); setTimeout(() => document.getElementById('input-token-selesai').focus(), 100);
        };

        window.verifyAndSubmit = function(correctToken) {
            const input = document.getElementById('input-token-selesai').value.trim().toUpperCase();
            if (input !== correctToken) { window.showNotification("⚠️ Token salah! Ujian belum dikumpulkan."); return; }
            document.getElementById('app-modal').classList.add('hidden'); window.submitFinalAnswers();
        };

        window.submitFinalAnswers = function() {
            window.isExamActive = false; if(window.examTimerInterval) clearInterval(window.examTimerInterval); window.releaseWakeLock();

            let score = 0, max = 0;
            window.examQuestions.forEach(q => {
                const s = window.studentAnswers[q.id]; const sk = parseInt(q.skor||2); max += sk;
                if (q.jenis === 'PGK') {
                    const kArr = (q.kunci||'').split(',').sort().join(',');
                    const sArr = (Array.isArray(s) ? s : []).sort().join(',');
                    if (kArr === sArr && kArr !== '') score += sk;
                } else {
                    if (s && s.toUpperCase() === String(q.kunci).toUpperCase()) score += sk;
                }
            });
            const nilai = max > 0 ? Math.round((score/max)*100) : 0;
            
            const newResult = { id: window.generateId(), username: window.currentUser.nomor, nama: window.currentUser.nama, kelas: window.currentUser.kelas, tingkat: window.currentUser.tingkat, mapel: window.currentUser.mapel, nilai, waktu: new Date().toISOString() };
            window.appData.hasil.push(newResult); window.clearExamState(); window.fullscreenWasEntered = false; try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e) {} window.saveHasilMerged(newResult); window.saveSiswaStatus(window.currentUser.nomor, { status_login: 'OFFLINE' });
            
            document.getElementById('content-container').innerHTML = `<div class="glass-card-dark p-8 rounded-3xl text-center max-w-sm mx-auto space-y-4 mt-12 border border-emerald-500/30 shadow-2xl"><div class="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl mb-2"><i class="fa-solid fa-check"></i></div><h2 class="text-lg font-bold text-white font-heading tracking-tight">Ujian Selesai</h2><p class="text-[10px] text-slate-400 uppercase tracking-widest">Nilai Anda:</p><div class="text-4xl font-black text-emerald-400 font-mono tracking-tighter drop-shadow-lg">${nilai}</div><button onclick="window.handleLogout()" class="w-full mt-4 py-2 gradient-btn text-white font-bold rounded-xl text-[10px] uppercase tracking-wider shadow-lg">Keluar</button></div>`;
        };

        window.blockStudentDueToViolation = function() {
            window.isExamActive = false; if(window.examTimerInterval) clearInterval(window.examTimerInterval); window.releaseWakeLock();
            window.clearExamState(); window.fullscreenWasEntered = false; try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e) {}
            window.saveSiswaStatus(window.currentUser.nomor, { status_blokir: 'BLOKIR' });
            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="glass-card-dark p-8 md:p-12 rounded-3xl text-center max-w-lg mx-auto space-y-6 mt-10 border border-red-500/50 shadow-[0_0_50px_rgba(239,68,68,0.3)]"><div class="w-24 h-24 bg-red-600 text-white rounded-full flex items-center justify-center mx-auto text-4xl shadow-xl animate-bounce"><i class="fa-solid fa-ban"></i></div><div><h2 class="text-2xl font-black text-red-500 uppercase tracking-tight mb-2 font-heading">AKUN DIBLOKIR!</h2><p class="text-[11px] text-slate-300">Terdeteksi melakukan pelanggaran ujian berkali-kali. Ujian dibatalkan otomatis.</p></div><button onclick="window.handleLogout()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl uppercase tracking-widest text-[10px] transition">Keluar Sesi</button></div>`;
        };

    </script>
</head>

                    <div>

                        <div class="relative">

                    <div class="text-center pt-2"><span class="text-[10px] font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-400 tracking-wide">Copyright @yudh82</span></div>
                </form>

                <form id="admin-login-form" onsubmit="window.handleAdminLogin(event)" class="space-y-4 text-left hidden">
                    <div><label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase tracking-widest">Admin Username</label><input type="text" id="admin-username" required class="w-full px-4 py-3 rounded-xl glass-input text-[11px] font-mono tracking-wide" placeholder="admin"></div>
                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase tracking-widest">Admin Password</label>
                        <div class="relative">
                            <input type="password" id="admin-password" required class="w-full px-4 py-3 rounded-xl glass-input text-[11px] font-mono pr-12 tracking-wide" placeholder="••••••••">
                            <button type="button" onclick="window.togglePassword('admin-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-pink-400"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-pink-600 hover:bg-pink-500 text-white font-black rounded-xl text-[10px] uppercase tracking-widest shadow-xl transition">Akses Sistem</button>
                    <div class="text-center pt-2"><span class="text-[10px] font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-400 tracking-wide">Copyright @yudh82</span></div>
                </form>
            </div>
        </div>

        <!-- MAIN APP -->

                <div class="flex items-center space-x-3 border-l border-slate-700 pl-4">
                    <div class="w-10 h-10 bg-slate-800 rounded-lg p-1 shadow-inner flex items-center justify-center">
                        <img id="mobile-logo-display" src="" class="max-w-full max-h-full object-contain mx-auto">
                    </div>
                    <div>
                        <h2 class="font-black text-white text-[11px] tracking-tight font-heading">SMPN 1 PABEDILAN</h2>
                        <p id="mobile-user-role" class="text-[9px] text-emerald-400 font-bold uppercase tracking-widest mt-0.5">Role</p>
                    </div>
                </div>
            </div>
            
            <div class="flex-1 flex flex-col md:flex-row h-full overflow-hidden relative">
                <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 z-50 w-64 h-full glass-card-dark border-r border-slate-800 p-5 flex flex-col justify-between transform -translate-x-full md:translate-x-0 hidden md:flex transition-transform duration-300 ease-in-out">
                    <div>
                        <div class="border-b border-slate-800 pb-5 mb-5 flex items-center space-x-3">
                            <div class="w-12 h-12 bg-slate-900 rounded-xl p-1.5 border border-slate-700 shrink-0 shadow-inner flex items-center justify-center">
                                <img id="sidebar-logo-display" src="" class="max-w-full max-h-full object-contain mx-auto">
                            </div>
                            <div class="overflow-hidden">
                                <h2 id="sidebar-user-name" class="font-black text-white text-[11px] truncate tracking-tight font-heading">SMPN 1</h2>
                                <p id="sidebar-user-role" class="text-[9px] text-emerald-400 font-bold uppercase mt-1 truncate tracking-widest">Role</p>
                            </div>
                        </div>
                        <nav id="nav-menu" class="space-y-1 overflow-y-auto max-h-[60vh] pr-1"></nav>
                    </div>
                    <div class="mt-auto pt-5 border-t border-slate-800">
                        <button onclick="window.handleLogout()" class="w-full flex items-center justify-center space-x-2 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-xl text-[10px] uppercase font-black tracking-widest border border-red-500/20 transition">
                            <i class="fa-solid fa-power-off"></i><span>Keluar</span>

                </aside>
                <div id="mobile-sidebar-overlay" onclick="window.toggleMobileSidebar()" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden md:hidden z-40"></div>
                
                <main class="flex-1 p-4 md:p-6 overflow-y-auto pb-12 relative z-10 w-full">
